[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "badminton-poc"
version = "0.1.0"
description = "Small technical POC for badminton video analysis"
requires-python = ">=3.11"
dependencies = [
  "ultralytics",
  "opencv-python",
  "numpy",
]

[project.scripts]
badminton-poc = "badminton_poc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
